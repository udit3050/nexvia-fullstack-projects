services:
  - type: web
    name: nexvia-fs01-api
    runtime: node
    plan: free
    region: singapore
    rootDir: FS-01/server
    buildCommand: npm install --include=dev && npx prisma generate && npm run build
    startCommand: npx prisma db push && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: JWT_SECRET
        generateValue: true
      - key: PLATFORM_COMMISSION_PERCENT
        value: "10"
      - key: PAYMENT_MODE
        value: test
      - key: DATABASE_URL
        fromDatabase:
          name: nexvia-fs01-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: nexvia-fs01-redis
          property: connectionString
      - key: CLIENT_URL
        value: https://nexvia-fs01-web-m4ix.onrender.com
  - type: web
    name: nexvia-fs01-web
    runtime: static
    rootDir: FS-01/client
    buildCommand: npm install --include=dev && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        value: https://nexvia-fs01-api-m4ix.onrender.com/api
  - type: web
    name: nexvia-fs02-api
    runtime: node
    plan: free
    region: singapore
    rootDir: FS-02/server
    buildCommand: npm install --include=dev && npx prisma generate && npm run build
    startCommand: npx prisma db push && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: nexvia-fs01-db
          property: connectionString
      - key: CLIENT_URL
        value: https://nexvia-fs02-web-m4ix.onrender.com
  - type: web
    name: nexvia-fs02-yjs
    runtime: node
    plan: free
    region: singapore
    rootDir: FS-02/server
    buildCommand: npm install
    startCommand: npm run yjs
    envVars:
      - key: PORT
        value: "10000"
  - type: web
    name: nexvia-fs02-web
    runtime: static
    rootDir: FS-02/client
    buildCommand: npm install --include=dev && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        value: https://nexvia-fs02-api-m4ix.onrender.com/api
      - key: VITE_YJS_URL
        value: wss://nexvia-fs02-yjs-m4ix.onrender.com
  - type: keyvalue
    name: nexvia-fs01-redis
    plan: free
    region: singapore
    ipAllowList: []

databases:
  - name: nexvia-fs01-db
    plan: free
    region: singapore
    databaseName: nexvia_marketplace
    user: nexvia_marketplace
