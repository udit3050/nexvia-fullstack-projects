services:
  - type: web
    name: nexvia-fs01-api
    runtime: node
    plan: free
    region: singapore
    rootDir: FS-01/server
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: JWT_SECRET
        generateValue: true
      - key: PLATFORM_COMMISSION_PERCENT
        value: "10"
      - key: PAYMENT_MODE
        value: test
      - key: DATABASE_URL
        fromDatabase:
          name: nexvia-fs01-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: nexvia-fs01-redis
          property: connectionString
      - key: CLIENT_URL
        value: https://nexvia-fs01-web.onrender.com
  - type: web
    name: nexvia-fs01-web
    runtime: static
    region: singapore
    rootDir: FS-01/client
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        value: https://nexvia-fs01-api.onrender.com/api
  - type: web
    name: nexvia-fs02-api
    runtime: node
    plan: free
    region: singapore
    rootDir: FS-02/server
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: nexvia-fs02-db
          property: connectionString
      - key: CLIENT_URL
        value: https://nexvia-fs02-web.onrender.com
  - type: web
    name: nexvia-fs02-yjs
    runtime: node
    plan: starter
    region: singapore
    rootDir: FS-02/server
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npm run yjs
    disk:
      name: yjs-data
      mountPath: /opt/render/project/src/.yjs-data
      sizeGB: 1
    envVars:
      - key: PORT
        value: "10000"
      - key: YPERSISTENCE
        value: /opt/render/project/src/.yjs-data
  - type: web
    name: nexvia-fs02-web
    runtime: static
    region: singapore
    rootDir: FS-02/client
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        value: https://nexvia-fs02-api.onrender.com/api
      - key: VITE_YJS_URL
        value: wss://nexvia-fs02-yjs.onrender.com
  - type: keyvalue
    name: nexvia-fs01-redis
    plan: free
    region: singapore
    ipAllowList: []

databases:
  - name: nexvia-fs01-db
    plan: free
    region: singapore
    databaseName: nexvia_marketplace
    user: nexvia_marketplace
  - name: nexvia-fs02-db
    plan: free
    region: singapore
    databaseName: nexvia_workspace
    user: nexvia_workspace
